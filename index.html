<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>قريتنا 3D - نموذج أولي</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { overflow: hidden; background: #87ceeb; color: #fff; user-select: none; }
    #canvas-container { position: fixed; inset: 0; }

    /* الشريط العلوي */
    .topbar {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .box {
      pointer-events: auto;
      background: rgba(18, 22, 30, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .title { font-weight: 800; color: #f6c453; font-size: 1rem; }
    .search-box input {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; padding: 7px 10px; border-radius: 10px; outline: none; width: 150px;
      font-size: 0.9rem;
    }
    .search-box input::placeholder { color: #cbd5e1; }
    button {
      background: #f6c453; color: #111; border: none; border-radius: 10px;
      padding: 7px 12px; font-weight: 700; cursor: pointer; font-size: 0.85rem;
      transition: transform 0.12s ease;
    }
    button:active { transform: scale(0.96); }
    button.secondary { background: rgba(255,255,255,0.14); color: #fff; }

    /* أزرار المناطق بالأسفل */
    .zones {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 8px; background: rgba(18, 22, 30, 0.85);
      padding: 8px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14);
    }

    /* نافذة تفاصيل البيت */
    .modal {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45); padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-card {
      width: 100%; max-width: 340px; background: #161b24;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 18px;
      padding: 18px; text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }
    .modal-card h2 { color: #f6c453; margin-bottom: 6px; font-size: 1.25rem; }
    .modal-card p { color: #cbd5e1; font-size: 0.92rem; margin-bottom: 14px; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; }
    .toast {
      position: fixed; top: 72px; left: 50%; transform: translateX(-50%); z-index: 30;
      background: #111827; color: #f6c453; padding: 8px 16px; border-radius: 999px;
      border: 1px solid rgba(246,196,83,0.4); font-size: 0.85rem; display: none;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="topbar">
    <div class="box">
      <span class="title">🏘️ قريتنا 3D</span>
      <span id="count-badge" style="font-size:0.8rem;color:#cbd5e1;"></span>
    </div>

    <div class="box search-box">
      <input type="text" id="searchInput" placeholder="دوّر بيتك (@اسم)..." />
      <button onclick="searchHouse()">بحث</button>
    </div>
  </div>

  <div class="zones">
    <button onclick="goToZone('village')">🏘️ القرية</button>
    <button class="secondary" onclick="goToZone('sea')">🌊 البحر</button>
    <button class="secondary" onclick="resetCamera()">🌍 نظرة عامة</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal" id="houseModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-card">
      <h2 id="m-owner">@user</h2>
      <p id="m-info">الحي: القرية الرئيسية · الطوابق: 1</p>
      <div class="modal-actions">
        <button onclick="addFloor()">🏢 زِد طابق للبيت</button>
        <button class="secondary" onclick="shareHouse()">🔗 نسخ رابط البيت</button>
        <button class="secondary" onclick="closeModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- Three.js + OrbitControls من CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. بيانات تجريبية للبيوت (لاحقاً تأتي من قاعدة بيانات)
    const housesData = [
      { id: 1, owner: 'ahmed', zone: 'القرية الشرقية', x: -12, z: -10, floors: 2, color: 0xf59e0b },
      { id: 2, owner: 'sara', zone: 'القرية الشرقية', x: 0, z: -10, floors: 1, color: 0xec4899 },
      { id: 3, owner: 'omar', zone: 'القرية الشرقية', x: 12, z: -10, floors: 3, color: 0x3b82f6 },
      { id: 4, owner: 'lina', zone: 'القرية الغربية', x: -12, z: 6, floors: 1, color: 0x10b981 },
      { id: 5, owner: 'ali', zone: 'القرية الغربية', x: 0, z: 6, floors: 2, color: 0x8b5cf6 },
      { id: 6, owner: 'noor', zone: 'القرية الغربية', x: 12, z: 6, floors: 1, color: 0xef4444 }
    ];

    document.getElementById('count-badge').textContent = `${housesData.length} بيوت`;

    // 2. إعداد المشهد والكاميرا والرندر
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8ecae6);
    scene.fog = new THREE.Fog(0x8ecae6, 45, 130);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(0, 26, 34);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.minDistance = 8;
    controls.maxDistance = 85;

    // 3. الإضاءة
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x4f772d, 1.1);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(25, 40, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 4. الأرض، الشارع، والبحر
    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(60, 1, 50),
      new THREE.MeshStandardMaterial({ color: 0x6a994e })
    );
    ground.position.y = -0.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // شارع وسط القرية
    const road = new THREE.Mesh(
      new THREE.BoxGeometry(56, 0.08, 4),
      new THREE.MeshStandardMaterial({ color: 0x374151 })
    );
    road.position.set(0, 0.04, -2);
    scene.add(road);

    // البحر بجانب القرية
    const sea = new THREE.Mesh(
      new THREE.BoxGeometry(90, 0.8, 55),
      new THREE.MeshStandardMaterial({ color: 0x0077b6, roughness: 0.25 })
    );
    sea.position.set(0, -0.6, 52);
    scene.add(sea);

    // 5. إنشاء لوحة اسم الحساب فوق كل بيت
    function createNameSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = 'rgba(17, 24, 39, 0.85)';
      ctx.beginPath();
      ctx.roundRect(12, 8, 232, 48, 16);
      ctx.fill();

      ctx.font = 'bold 26px sans-serif';
      ctx.fillStyle = '#f6c453';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('@' + text, 128, 33);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(5.5, 1.4, 1);
      return sprite;
    }

    // 6. بناء مجسمات البيوت
    const houseMeshes = [];
    const houseMap = new Map();

    function buildHouse(data) {
      const group = new THREE.Group();
      group.position.set(data.x, 0, data.z);
      group.userData = data;

      const floorHeight = 2.2;
      const bodyHeight = data.floors * floorHeight;

      // جسم البيت
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(4.4, bodyHeight, 4.4),
        new THREE.MeshStandardMaterial({ color: data.color })
      );
      body.position.y = bodyHeight / 2;
      body.castShadow = true;
      body.receiveShadow = true;
      body.userData = data;
      group.add(body);
      houseMeshes.push(body);

      // السقف الهرمي
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(3.4, 1.8, 4),
        new THREE.MeshStandardMaterial({ color: 0x7f1d1d })
      );
      roof.position.y = bodyHeight + 0.9;
      roof.rotation.y = Math.PI / 4;
      roof.castShadow = true;
      group.add(roof);

      // الباب
      const door = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1.5, 0.2),
        new THREE.MeshStandardMaterial({ color: 0x1f2937 })
      );
      door.position.set(0, 0.75, 2.25);
      group.add(door);

      // اسم الحساب فوق البيت
      const label = createNameSprite(data.owner);
      label.position.set(0, bodyHeight + 2.7, 0);
      group.add(label);

      scene.add(group);
      houseMap.set(data.owner.toLowerCase(), { data, group });
    }

    housesData.forEach(buildHouse);

    // 7. حركة الكاميرا السلسة
    let targetCamPos = null;
    let targetLookAt = null;

    function focusOn(x, y, z, camOffset = { x: 0, y: 9, z: 13 }) {
      targetLookAt = new THREE.Vector3(x, y, z);
      targetCamPos = new THREE.Vector3(x + camOffset.x, y + camOffset.y, z + camOffset.z);
    }

    window.resetCamera = () => focusOn(0, 0, 0, { x: 0, y: 26, z: 34 });

    window.goToZone = (zone) => {
      if (zone === 'sea') {
        focusOn(0, 0, 46, { x: 0, y: 12, z: 18 });
        showToast('🌊 وصلت إلى منطقة البحر');
      } else {
        focusOn(0, 0, -2, { x: 0, y: 22, z: 28 });
        showToast('🏘️ القرية الرئيسية');
      }
    };

    // 8. النقر على البيت (Raycaster)
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let selectedHouse = null;

    window.addEventListener('pointerdown', (e) => {
      if (e.target !== renderer.domElement) return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(houseMeshes);
      if (hits.length > 0) {
        const data = hits[0].object.userData;
        openHouseModal(data);
        focusOn(data.x, 2, data.z, { x: 0, y: 7, z: 11 });
      }
    });

    function openHouseModal(data) {
      selectedHouse = data;
      document.getElementById('m-owner').textContent = '@' + data.owner;
      document.getElementById('m-info').textContent = `${data.zone} · الطوابق: ${data.floors}`;
      document.getElementById('houseModal').classList.add('open');
    }

    window.closeModal = () => {
      document.getElementById('houseModal').classList.remove('open');
    };

    // زيادة طابق وتحديث المجسم مباشرة
    window.addFloor = () => {
      if (!selectedHouse) return;
      selectedHouse.floors += 1;
      const entry = houseMap.get(selectedHouse.owner.toLowerCase());
      if (entry) {
        // إزالة المجسم القديم وبناء الجديد بالطوابق المحدثة
        scene.remove(entry.group);
        const idx = houseMeshes.findIndex(m => m.userData.id === selectedHouse.id);
        if (idx !== -1) houseMeshes.splice(idx, 1);
        buildHouse(selectedHouse);
      }
      openHouseModal(selectedHouse);
      showToast(`✨ تم بناء الطابق رقم ${selectedHouse.floors} لبيت @${selectedHouse.owner}`);
    };

    // مشاركة رابط مباشر للبيت
    window.shareHouse = async () => {
      if (!selectedHouse) return;
      const url = `${location.origin}${location.pathname}?house=${encodeURIComponent(selectedHouse.owner)}`;
      try {
        await navigator.clipboard.writeText(url);
        showToast('🔗 تم نسخ رابط البيت!');
      } catch {
        showToast('الرابط: ?house=' + selectedHouse.owner);
      }
    };

    // البحث عن بيت
    window.searchHouse = () => {
      const raw = document.getElementById('searchInput').value.trim().replace(/^@/, '').toLowerCase();
      if (!raw) return;
      const found = houseMap.get(raw);
      if (!found) {
        showToast('❌ ما لقينا بيت بهذا الاسم');
        return;
      }
      focusOn(found.data.x, 2, found.data.z, { x: 0, y: 7, z: 11 });
      openHouseModal(found.data);
    };

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._t);
      window._t = setTimeout(() => el.style.display = 'none', 2600);
    }

    // فتح البيت تلقائياً إذا جاء الرابط مع ?house=ahmed
    const params = new URLSearchParams(location.search);
    const initialHouse = params.get('house');
    if (initialHouse && houseMap.has(initialHouse.toLowerCase())) {
      const h = houseMap.get(initialHouse.toLowerCase()).data;
      setTimeout(() => {
        focusOn(h.x, 2, h.z, { x: 0, y: 7, z: 11 });
        openHouseModal(h);
      }, 400);
    }

    // تحديث المقاس عند تدوير الشاشة
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // حلقة الرسم
    function animate() {
      requestAnimationFrame(animate);
      if (targetCamPos && targetLookAt) {
        camera.position.lerp(targetCamPos, 0.08);
        controls.target.lerp(targetLookAt, 0.08);
        if (camera.position.distanceTo(targetCamPos) < 0.2) {
          targetCamPos = null;
          targetLookAt = null;
        }
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
