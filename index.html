<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>قريتنا 3D - البيوت، العفش، وشام كاش</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { overflow: hidden; background: #87ceeb; color: #fff; user-select: none; }
    #canvas-container { position: fixed; inset: 0; }

    .topbar {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .box {
      pointer-events: auto;
      background: rgba(16, 20, 28, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(246, 196, 83, 0.25);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
    }
    .title { font-weight: 800; color: #f6c453; font-size: 0.98rem; }
    input {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.16);
      color: #fff; padding: 7px 10px; border-radius: 10px; outline: none; font-size: 0.88rem;
    }
    input::placeholder { color: #cbd5e1; }
    .search-box input { width: 135px; }

    button {
      background: #f6c453; color: #111; border: none; border-radius: 10px;
      padding: 7px 11px; font-weight: 700; cursor: pointer; font-size: 0.84rem;
      transition: transform 0.12s ease;
    }
    button:active { transform: scale(0.96); }
    button.secondary { background: rgba(255,255,255,0.14); color: #fff; }
    button.green { background: #10b981; color: #06281e; }

    .zones {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
      display: flex; gap: 8px; background: rgba(16, 20, 28, 0.88);
      padding: 8px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14);
    }

    .modal {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55); padding: 14px;
    }
    .modal.open { display: flex; }
    .modal-card {
      width: 100%; max-width: 390px; max-height: 88vh; overflow-y: auto;
      background: #141923; border: 1px solid rgba(246,196,83,0.3);
      border-radius: 18px; padding: 18px; text-align: center;
      box-shadow: 0 18px 45px rgba(0,0,0,0.5);
    }
    .modal-card h2 { color: #f6c453; margin-bottom: 6px; font-size: 1.2rem; }
    .modal-card p { color: #cbd5e1; font-size: 0.88rem; margin-bottom: 12px; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; }

    .shop-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; text-align: right;
    }
    .item-card {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
    }
    .item-name { font-weight: 700; font-size: 0.9rem; color: #fff; }
    .item-price { color: #f6c453; font-weight: 800; font-size: 0.88rem; }
    .owned-tag { font-size: 0.75rem; color: #34d399; }

    .sham-box {
      background: rgba(246,196,83,0.1); border: 1px dashed #f6c453;
      border-radius: 12px; padding: 10px; margin: 10px 0; text-align: center;
    }
    .sham-code {
      font-family: monospace; font-size: 0.82rem; color: #f6c453;
      word-break: break-all; margin: 6px 0; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 8px;
    }

    .toast {
      position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 35;
      background: #111827; color: #f6c453; padding: 8px 16px; border-radius: 999px;
      border: 1px solid rgba(246,196,83,0.45); font-size: 0.85rem; display: none; white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="topbar">
    <div class="box">
      <span class="title">🏘️ قريتنا 3D</span>
      <span id="count-badge" style="font-size:0.8rem;color:#cbd5e1;"></span>
      <button class="green" onclick="openCreateModal()">+ بيت جديد</button>
    </div>

    <div class="box search-box">
      <input type="text" id="searchInput" placeholder="دوّر بيتك (@اسم)..." />
      <button onclick="searchHouse()">بحث</button>
    </div>
  </div>

  <div class="zones">
    <button onclick="goToZone('village')">🏘️ القرية</button>
    <button class="secondary" onclick="goToZone('sea')">🌊 البحر</button>
    <button class="secondary" onclick="resetCamera()">🌍 نظرة عامة</button>
  </div>

  <div class="toast" id="toast"></div>

  <!-- نافذة إنشاء بيت جديد فاضي -->
  <div class="modal" id="createModal" onclick="if(event.target===this) closeCreateModal()">
    <div class="modal-card">
      <h2>🏗️ بناء بيت جديد فارغ</h2>
      <p>أدخل اسم الحساب ليُبنى بيته تلقائياً في القرية (فارغ بدون سقف أو عفش حتى يشتري له).</p>
      <input type="text" id="newOwnerInput" placeholder="مثال: khaled_2026" style="width:100%; margin-bottom:10px;" />
      <div class="modal-actions">
        <button class="green" onclick="createEmptyHouse()">بناء البيت الآن</button>
        <button class="secondary" onclick="closeCreateModal()">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة تفاصيل البيت -->
  <div class="modal" id="houseModal" onclick="if(event.target===this) closeHouseModal()">
    <div class="modal-card">
      <h2 id="m-owner">@user</h2>
      <p id="m-info">الحالة: بيت فارغ · العفش: 0</p>
      <div class="modal-actions">
        <button onclick="openShopModal()">🛋️ سوق العفش ($)</button>
        <button class="secondary" onclick="openFloorPayment()">🏢 زِد طابق ($2)</button>
        <button class="secondary" onclick="shareHouse()">🔗 نسخ رابط البيت</button>
        <button class="secondary" onclick="closeHouseModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- نافذة سوق العفش -->
  <div class="modal" id="shopModal" onclick="if(event.target===this) closeShopModal()">
    <div class="modal-card">
      <h2>🛋️ سوق عفش البيت</h2>
      <p id="shop-house-label">للبيت: @user</p>
